name: Functional Tests

permissions:
  contents: read

on:
  push:
    paths:
      - 'bin/**'
      - 'scripts/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'scripts/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq gnupg util-linux bsdextrautils shellcheck
      - name: Run functional tests
        run: bash tests/run.sh
